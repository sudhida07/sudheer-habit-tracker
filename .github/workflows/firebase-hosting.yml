name: Deploy to Firebase Hosting

# Auto-deploys the site whenever you push to main.
# Setup (one time):
#   1. Create a Firebase service account key (Project Settings → Service accounts
#      → Generate new private key), OR run: firebase init hosting:github
#   2. Add the JSON as a repo secret named FIREBASE_SERVICE_ACCOUNT
#      (Settings → Secrets and variables → Actions → New repository secret)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: sudheer-habit-tracker
