<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fyers Algo Dashboard</title>
<style>
  :root {
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
    --good:           #006300;
    --bad:            #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --good:           #0ca30c;
      --bad:            #d03b3b;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--text-primary);
    padding: 24px; max-width: 1100px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 650; }
  .badge {
    font-size: 12px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-secondary);
  }
  .badge.live { color: var(--bad); border-color: var(--bad); font-weight: 600; }
  #status { font-size: 13px; color: var(--text-muted); margin-left: auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 24px; font-weight: 650; }
  .tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-top: 16px;
  }
  .card h2 { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; }
  #chartwrap { position: relative; }
  #chart { width: 100%; height: 220px; display: block; }
  #tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap;
  }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--grid); }
  td { padding: 7px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  td.reason { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
  .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
</style>
</head>
<body>
<header>
  <h1>Fyers Algo Trading</h1>
  <span id="mode" class="badge">…</span>
  <span id="status">connecting…</span>
</header>

<section class="tiles">
  <div class="tile"><div class="label">Capital</div><div class="value" id="capital">–</div></div>
  <div class="tile"><div class="label">Today's P&amp;L</div><div class="value" id="pnl">–</div>
    <div class="sub" id="pnlsplit"></div></div>
  <div class="tile"><div class="label">Daily target</div><div class="value" id="target">–</div>
    <div class="sub" id="progress"></div></div>
  <div class="tile"><div class="label">Trades today</div><div class="value" id="ntrades">–</div>
    <div class="sub" id="winrate"></div></div>
</section>

<div class="card">
  <h2>Equity curve — today's P&amp;L (₹)</h2>
  <div id="chartwrap">
    <svg id="chart" role="img" aria-label="Intraday profit and loss line chart"></svg>
    <div id="tooltip"></div>
  </div>
</div>

<div class="card">
  <h2>Trades</h2>
  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th>
        <th>Exit</th><th>SL</th><th>Target</th><th>P&amp;L</th><th>Status</th><th>Claude</th>
      </tr></thead>
      <tbody id="trows"></tbody>
    </table>
    <div class="empty" id="noTrades" style="display:none">No trades yet today.</div>
  </div>
</div>

<!-- Firebase Hosting reserved URLs: auto-configured for this project on deploy -->
<script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.2/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script>
const inr = n => "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits: 0});
const inr2 = n => "₹" + Number(n).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "";
let equity = [];

function drawChart() {
  const svg = document.getElementById("chart");
  const W = svg.clientWidth, H = svg.clientHeight;
  const pad = {l: 54, r: 12, t: 10, b: 22};
  svg.innerHTML = "";
  if (equity.length < 2) {
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--text-muted)" font-size="13">Waiting for market data…</text>`;
    return;
  }
  const vals = equity.map(d => d.pnl);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi - lo < 1) { hi += 1; lo -= 1; }
  const x = i => pad.l + (W - pad.l - pad.r) * i / (equity.length - 1);
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - lo) / (hi - lo));
  const ns = "http://www.w3.org/2000/svg";
  const el = (t, a) => { const e = document.createElementNS(ns, t);
    for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };

  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, yy = y(v);
    el("line", {x1: pad.l, x2: W - pad.r, y1: yy, y2: yy, stroke: "var(--grid)", "stroke-width": 1});
    const t = el("text", {x: pad.l - 8, y: yy + 4, "text-anchor": "end",
      fill: "var(--text-muted)", "font-size": 11});
    t.textContent = inr(v);
  }
  el("line", {x1: pad.l, x2: W - pad.r, y1: y(0), y2: y(0), stroke: "var(--baseline)", "stroke-width": 1});
  [0, Math.floor(equity.length/2), equity.length-1].forEach(i => {
    const t = el("text", {x: x(i), y: H - 6, "text-anchor": i===0?"start":i===equity.length-1?"end":"middle",
      fill: "var(--text-muted)", "font-size": 11});
    t.textContent = equity[i].ts;
  });
  const d = equity.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.pnl).toFixed(1)).join(" ");
  el("path", {d, fill: "none", stroke: "var(--series-1)", "stroke-width": 2,
    "stroke-linejoin": "round", "stroke-linecap": "round"});
  const hover = el("line", {y1: pad.t, y2: H - pad.b, stroke: "var(--baseline)", "stroke-width": 1, visibility: "hidden"});
  const dot = el("circle", {r: 4, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden"});
  const tip = document.getElementById("tooltip");
  svg.onmousemove = ev => {
    const r = svg.getBoundingClientRect();
    const mx = ev.clientX - r.left;
    const i = Math.max(0, Math.min(equity.length - 1,
      Math.round((mx - pad.l) / (W - pad.l - pad.r) * (equity.length - 1))));
    const px = x(i), py = y(equity[i].pnl);
    hover.setAttribute("x1", px); hover.setAttribute("x2", px); hover.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    tip.style.display = "block";
    tip.style.left = Math.min(px + 10, W - 130) + "px";
    tip.style.top = (py - 34) + "px";
    tip.innerHTML = `${equity[i].ts} &nbsp; <b class="${cls(equity[i].pnl)}">${inr2(equity[i].pnl)}</b>`;
  };
  svg.onmouseleave = () => {
    hover.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden");
    tip.style.display = "none";
  };
}

function render(s) {
  const mode = document.getElementById("mode");
  mode.textContent = s.mode === "live" ? "LIVE" : "PAPER";
  mode.className = "badge" + (s.mode === "live" ? " live" : "");
  document.getElementById("status").textContent =
    (s.status.engine || "engine not running") + (s.status.updated ? " · " + s.status.updated.slice(11,19) : "");
  document.getElementById("capital").textContent = inr(s.capital);
  const pnl = document.getElementById("pnl");
  pnl.textContent = inr2(s.total_pnl); pnl.className = "value " + cls(s.total_pnl);
  document.getElementById("pnlsplit").textContent =
    `realized ${inr2(s.realized_pnl)} · open ${inr2(s.unrealized_pnl)}`;
  document.getElementById("target").textContent = inr(s.daily_target);
  document.getElementById("progress").textContent = `${s.target_progress_pct}% of target`;
  document.getElementById("ntrades").textContent = s.trades.length;
  document.getElementById("winrate").textContent =
    s.win_rate === null ? "no closed trades" : `win rate ${s.win_rate}% (${s.closed_trades} closed)`;

  equity = s.equity || [];
  drawChart();

  const rows = document.getElementById("trows");
  rows.innerHTML = "";
  document.getElementById("noTrades").style.display = s.trades.length ? "none" : "block";
  for (const t of s.trades) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${t.ts.slice(11,16)}</td><td>${t.symbol.replace("NSE:","")}</td><td>${t.side}</td>` +
      `<td>${t.qty}</td><td>${inr2(t.entry_price)}</td>` +
      `<td>${t.exit_price ? inr2(t.exit_price) : "–"}</td>` +
      `<td>${inr2(t.stoploss)}</td><td>${inr2(t.target)}</td>` +
      `<td class="${cls(t.pnl)}">${t.status === "CLOSED" ? inr2(t.pnl) : "–"}</td>` +
      `<td>${t.status}${t.exit_reason ? " · " + t.exit_reason : ""}</td>` +
      `<td class="reason" title="${(t.claude_reasoning||"").replace(/"/g,"&quot;")}">${t.claude_reasoning || ""}</td>`;
    rows.appendChild(tr);
  }
}

// Live subscription: Firestore pushes every engine update to this page.
firebase.firestore().collection("algo").doc("dashboard").onSnapshot(
  doc => {
    if (doc.exists) render(doc.data());
    else document.getElementById("status").textContent =
      "no data yet — start the engine with firebase.enabled: true";
  },
  err => { document.getElementById("status").textContent = "connection error: " + err.code; }
);
window.addEventListener("resize", drawChart);
</script>
</body>
</html>
